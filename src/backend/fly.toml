app = 'oneagent-api'
primary_region = 'iad'

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_SERVER = 'true'
  PHX_HOST = 'oneagent-api.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
